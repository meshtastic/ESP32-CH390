[platformio]
default_envs = esp32dev
src_dir = .

[env]
framework = arduino
lib_extra_dirs = ../../
monitor_speed = 115200

; ESP-IDF 4.4 toolchain (classic Arduino-ESP32 2.x)
[idf4]
platform = espressif32

; ESP-IDF 5.5 toolchain (pioarduino, Arduino-ESP32 3.3.8 - matches Meshtastic develop)
[idf5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip

[env:esp32dev]
extends = idf4
board = esp32dev

[env:esp32doit-devkit-v1]
extends = idf4
board = esp32doit-devkit-v1

[env:esp32-s3-devkitc-1]
extends = idf4
board = esp32-s3-devkitc-1

[env:esp32-c3-devkitc-02]
extends = idf4
board = esp32-c3-devkitc-02

[env:esp32dev-idf5]
extends = idf5
board = esp32dev

[env:esp32doit-devkit-v1-idf5]
extends = idf5
board = esp32doit-devkit-v1

[env:esp32-s3-devkitc-1-idf5]
extends = idf5
board = esp32-s3-devkitc-1

[env:esp32-c3-devkitc-02-idf5]
extends = idf5
board = esp32-c3-devkitc-02
